<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <title>Samantha</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0a0a0a;
      }

      #launch-cover {
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
        overflow: hidden;
        background: linear-gradient(to top, rgba(168, 85, 247, 0.15), transparent 30%), #0a0a0a;
        opacity: 1;
        transition: opacity 450ms ease-out;
      }

      #launch-cover.launch-cover--ready {
        opacity: 0;
      }

      .launch-lockup {
        position: absolute;
        top: calc(50% - 108px);
        left: 50%;
        display: flex;
        transform: translate(-50%, -50%);
        flex-direction: column;
        align-items: center;
      }

      .launch-lockup img {
        width: 176px;
        height: 176px;
        object-fit: contain;
        filter: drop-shadow(0 0 38px rgba(168, 85, 247, 0.55));
      }

      .launch-lockup span {
        margin-top: -16px;
        color: rgba(255, 255, 255, 0.9);
        font-family: "Geist", sans-serif;
        font-size: 24px;
        font-weight: 100;
        line-height: 1;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      @media (prefers-reduced-motion: reduce) {
        #launch-cover {
          transition-duration: 0ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="launch-cover" aria-hidden="true">
      <div class="launch-lockup">
        <img src="/samantha_flame_eternal_trans.png" alt="" />
        <span>Samantha</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
